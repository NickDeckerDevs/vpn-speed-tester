<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VPN Speed Tester — Control Panel</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1f232c;
    --line: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8b93a3;
    --accent: #5aa9ff;
    --ok: #5be39a;
    --warn: #f5b342;
    --err: #ff7676;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 0.85rem; }
  header .spacer { flex: 1; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); display: inline-block; margin-right: 6px;
  }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  button {
    font: inherit; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text);
    padding: 0.35rem 0.75rem; border-radius: 4px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #0b0d12; border-color: var(--accent); font-weight: 600; }
  button.danger  { background: #3a2026; border-color: #6b3a44; color: var(--err); }
  main {
    display: grid; grid-template-columns: 360px 1fr;
    height: calc(100vh - 50px);
  }
  #cards {
    padding: 1rem; overflow-y: auto;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 0.75rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.75rem 0.9rem;
  }
  .card h3 {
    margin: 0 0 0.25rem; font-size: 0.95rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .card h3 code { font-size: 0.85rem; color: var(--accent); font-weight: 500; }
  .card .desc { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
  .flagrow { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
  .flagrow label {
    font-size: 0.8rem; padding: 0.2rem 0.5rem;
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
    color: var(--muted);
  }
  .flagrow input { display: none; }
  .flagrow input:checked + span { color: var(--accent); }
  .flagrow label:has(input:checked) { border-color: var(--accent); }
  .actions { display: flex; gap: 0.4rem; }
  .actions .status { flex: 1; font-size: 0.8rem; color: var(--muted); align-self: center; }
  #right {
    display: flex; flex-direction: column;
    min-width: 0; /* allow children to shrink */
  }
  #tabs {
    display: flex; gap: 0.25rem; padding: 0.5rem 0.75rem 0;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  .tab {
    padding: 0.4rem 0.75rem; font-size: 0.85rem;
    border: 1px solid var(--line); border-bottom: none;
    border-radius: 4px 4px 0 0; cursor: pointer;
    background: var(--panel); color: var(--muted);
    white-space: nowrap;
  }
  .tab.active { background: var(--panel-2); color: var(--text); }
  .tab .close { margin-left: 0.5rem; opacity: 0.6; }
  .tab .close:hover { opacity: 1; color: var(--err); }
  #consoles { flex: 1; position: relative; overflow: hidden; }
  .console {
    position: absolute; inset: 0;
    background: #0a0c10;
    color: var(--text);
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    padding: 0.75rem 1rem;
    overflow-y: auto;
    display: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .console.active { display: block; }
  .line { display: flex; gap: 0.5rem; align-items: flex-start; }
  .line .badge {
    font-size: 0.7rem; padding: 0 0.4rem; border-radius: 3px;
    flex-shrink: 0; line-height: 1.4; margin-top: 1px;
    color: #0b0d12; font-weight: 600;
  }
  .badge.stdout { background: #4a5163; color: #cdd3df; }
  .badge.stderr { background: var(--warn); }
  .badge.error  { background: var(--err); }
  .badge.exit   { background: var(--ok); }
  .empty { color: var(--muted); padding: 1rem; }
</style>
</head>
<body>

<header>
  <span class="dot" id="server-dot"></span>
  <h1>VPN Speed Tester <span class="sub">— local control panel</span></h1>
  <span class="spacer"></span>
  <button id="stop-all" class="danger">Stop all</button>
</header>

<main>
  <div id="cards"></div>
  <div id="right">
    <div id="tabs"><div class="empty" id="tabs-empty">No active runs</div></div>
    <div id="consoles">
      <div class="empty" id="consoles-empty">Click a Run button on the left. Output will stream here.</div>
    </div>
  </div>
</main>

<script>
const cardsEl = document.getElementById('cards');
const tabsEl = document.getElementById('tabs');
const consolesEl = document.getElementById('consoles');
const tabsEmpty = document.getElementById('tabs-empty');
const consolesEmpty = document.getElementById('consoles-empty');
const serverDot = document.getElementById('server-dot');

// runId → { cmd, flag, tabEl, consoleEl, streamSrc, cardEl, done }
const activeRuns = new Map();
// cmd name → cardEl (so we can disable while running)
const cardByCmd = new Map();
let activeTabId = null;

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function flagLabel(flag) {
  return flag === '' ? '(default)' : flag;
}

function buildCard(cmd, info) {
  const card = el('div', { class: 'card' });
  card.appendChild(el('h3', {}, el('code', {}, './vpn ' + cmd)));
  card.appendChild(el('div', { class: 'desc' }, info.desc));

  let chosenFlag = info.flags[0];
  if (info.flags.length > 1) {
    const row = el('div', { class: 'flagrow' });
    for (const f of info.flags) {
      const id = 'f-' + cmd + '-' + (f || 'none');
      const input = el('input', { type: 'radio', name: 'flag-' + cmd, id });
      if (f === chosenFlag) input.checked = true;
      input.addEventListener('change', () => { chosenFlag = f; });
      const label = el('label', { for: id }, input, el('span', {}, flagLabel(f)));
      row.appendChild(label);
    }
    card.appendChild(row);
  }

  const status = el('span', { class: 'status' }, 'idle');
  const runBtn = el('button', { class: 'primary' }, 'Run');
  const stopBtn = el('button', { class: 'danger' }, 'Stop');
  stopBtn.disabled = true;
  runBtn.addEventListener('click', () => launchRun(cmd, chosenFlag, card, runBtn, stopBtn, status));
  stopBtn.addEventListener('click', () => {
    const runId = card.dataset.runId;
    if (runId) fetch('/api/stop/' + runId, { method: 'POST' });
  });
  card.appendChild(el('div', { class: 'actions' }, runBtn, stopBtn, status));
  cardByCmd.set(cmd, { card, runBtn, stopBtn, status });
  return card;
}

async function launchRun(cmd, flag, cardEl, runBtn, stopBtn, statusEl) {
  runBtn.disabled = true;
  statusEl.textContent = 'starting…';
  let resp, data;
  try {
    resp = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd, flag }),
    });
    data = await resp.json();
  } catch (e) {
    statusEl.textContent = 'request failed';
    runBtn.disabled = false;
    return;
  }
  if (!resp.ok) {
    statusEl.textContent = 'rejected: ' + (data && data.error || resp.status);
    runBtn.disabled = false;
    return;
  }
  const runId = data.runId;
  cardEl.dataset.runId = runId;
  stopBtn.disabled = false;
  statusEl.textContent = 'running';
  openRunTab(runId, cmd, flag, cardEl, runBtn, stopBtn, statusEl);
}

function openRunTab(runId, cmd, flag, cardEl, runBtn, stopBtn, statusEl) {
  tabsEmpty.style.display = 'none';
  consolesEmpty.style.display = 'none';

  const title = './vpn ' + cmd + (flag ? ' ' + flag : '');
  const tab = el('div', { class: 'tab' });
  const tabLabel = el('span', {}, title);
  const closeBtn = el('span', { class: 'close' }, '×');
  closeBtn.addEventListener('click', (ev) => { ev.stopPropagation(); closeRun(runId); });
  tab.appendChild(tabLabel);
  tab.appendChild(closeBtn);
  tab.addEventListener('click', () => activateTab(runId));
  tabsEl.appendChild(tab);

  const consoleEl = el('div', { class: 'console' });
  consolesEl.appendChild(consoleEl);

  const src = new EventSource('/api/stream/' + runId);
  const appendLine = (kind, text) => {
    const wasAtBottom = Math.abs(consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight) < 30;
    const line = el('div', { class: 'line' },
      el('span', { class: 'badge ' + kind }, kind),
      el('span', {}, text)
    );
    consoleEl.appendChild(line);
    if (wasAtBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
  };
  src.addEventListener('stdout', e => appendLine('stdout', JSON.parse(e.data)));
  src.addEventListener('stderr', e => appendLine('stderr', JSON.parse(e.data)));
  src.addEventListener('error',  e => { try { appendLine('error', JSON.parse(e.data)); } catch {} });
  src.addEventListener('exit',   e => {
    const { code } = JSON.parse(e.data);
    appendLine('exit', 'process exited with code ' + code);
    statusEl.textContent = code === 0 ? 'done (0)' : 'exit ' + code;
    runBtn.disabled = false;
    stopBtn.disabled = true;
    delete cardEl.dataset.runId;
    src.close();
    const run = activeRuns.get(runId);
    if (run) run.done = true;
  });

  activeRuns.set(runId, { cmd, flag, tabEl: tab, consoleEl, streamSrc: src, cardEl, done: false });
  activateTab(runId);
}

function activateTab(runId) {
  activeTabId = runId;
  for (const [id, run] of activeRuns) {
    run.tabEl.classList.toggle('active', id === runId);
    run.consoleEl.classList.toggle('active', id === runId);
  }
}

function closeRun(runId) {
  const run = activeRuns.get(runId);
  if (!run) return;
  if (!run.done) {
    // Closing a still-running tab also stops it — simplest mental model.
    fetch('/api/stop/' + runId, { method: 'POST' });
  }
  run.streamSrc.close();
  run.tabEl.remove();
  run.consoleEl.remove();
  activeRuns.delete(runId);
  if (activeTabId === runId) {
    const next = activeRuns.keys().next().value;
    if (next) activateTab(next);
    else { activeTabId = null; tabsEmpty.style.display = ''; consolesEmpty.style.display = ''; }
  }
}

document.getElementById('stop-all').addEventListener('click', () => {
  for (const [runId, run] of activeRuns) {
    if (!run.done) fetch('/api/stop/' + runId, { method: 'POST' });
  }
});

async function init() {
  try {
    const r = await fetch('/api/commands');
    if (!r.ok) throw new Error('bad status');
    const commands = await r.json();
    serverDot.classList.add('ok');
    // Preserve declared order from the manifest.
    for (const [cmd, info] of Object.entries(commands)) {
      cardsEl.appendChild(buildCard(cmd, info));
    }
  } catch (e) {
    serverDot.classList.add('err');
    cardsEl.appendChild(el('div', { class: 'empty' }, 'Could not reach vpn-ui server.'));
  }
}
init();
</script>
</body>
</html>
