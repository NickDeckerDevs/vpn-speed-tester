# docker-compose.desktop.yml — desktop CONTINUOUS validation stack (Part 2, revised).
#
# Mirrors the NAS architecture so it reuses the proven machinery: an orchestrator
# container (docker.sock mounted, on the same network as gluetun) runs
# validationMain.js, which uses gluetunManager.switchServer / waitForTunnel /
# speedTester.runSpeedtest to switch + measure. It never touches the live media stack.
#
# WIREGUARD_* + QBT_* come from .env. The advisor model is mounted read-only.
#
# Changelog
# 2026-06-06  created — minimal gluetun + runner (host-driven)
# 2026-06-06  rewrite — add orchestrator service running continuous validationMain.js;
#               reuse gluetunManager instead of host docker-compose shell-outs

services:

  gluetun-speedtest:
    image: qmcgaw/gluetun:v3.41.1
    container_name: gluetun-speedtest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=United States
      - SERVER_NAMES=${SERVER_NAMES:-Aladfar}
      - DNS_SERVERS=1.1.1.1,8.8.8.8
      - DNS_IPV6=false
      - TZ=America/New_York
    volumes:
      - ./desktop-validation/gluetun:/gluetun
    healthcheck:
      test: ping -c 1 -W 5 1.1.1.1 || exit 1
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  speedtest-runner:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: speedtest-runner
    network_mode: "service:gluetun-speedtest"
    entrypoint: []
    command: sleep infinity
    # A /data bind so gluetunManager's captureBaseConfig sees non-null base binds
    # (otherwise switchServer falls back to the NAS path on recreate).
    volumes:
      - ./desktop-validation/runner-data:/data
    depends_on:
      - gluetun-speedtest

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: orchestrator
    command: node validationMain.js
    env_file: .env
    environment:
      - TZ=America/New_York
      - VALIDATION_RUNS_PER_SERVER=2
    volumes:
      - ./desktop-validation/data:/data
      - ./analysis/server-model.json:/config/server-model.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - gluetun-speedtest
      - speedtest-runner
    restart: unless-stopped
